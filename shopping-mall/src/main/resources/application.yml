server:
  port: ${SERVER_PORT:}
management:
  health:
    elasticsearch:
      enabled: false
    redis:
      enabled: false
    rabbit:
      enabled: false
    db:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
spring:
  application:
    name: shopping-mall
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://${DATABASE_HOST:}:${DATABASE_PORT:}/${DATABASE_NAME:}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${DATABASE_INIT:always}
      schema-locations: "classpath:schema.sql"
  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:}
      timeout: 3000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:}
    port: ${RABBITMQ_PORT:}
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:}
  elasticsearch:
    uris: ${ELASTICSEARCH_URL:}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}

aws:
  s3:
    access-key: ${AWS_S3_ACCESS_KEY_ID}
    secret-key: ${AWS_S3_SECRET_ACCESS_KEY}
    region: ${AWS_S3_REGION}
    bucket-name: ${AWS_S3_BUCKET_NAME}

mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  type-aliases-package: com.me.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

canal:
  host: ${CANAL_HOST:}
  port: ${CANAL_PORT:}
  destination: ${CANAL_DESTINATION:}
  username: ${CANAL_USERNAME:}
  password: ${CANAL_PASSWORD:}

logging:
  level:
    com.me: debug